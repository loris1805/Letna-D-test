<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Teplice D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#10263d" />
  <link rel="manifest" href="manifest.json" />
  <title>TJ Teplice Letná D — Okresní přebor B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #10263d;
      --navy-2: #17344f;
      --ink: #172230;
      --muted: #4e5b6a;
      --paper: #efe7da;
      --card: #fffcf7;
      --line: #ddd1bf;
      --gold: #c9a45a;
      --green: #1f6d42;
      --red: #a83232;
      --blue: #215d86;
      --shadow: 0 8px 24px rgba(16,38,61,.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    .hero {
      background: var(--navy);
      color: #fff;
      padding: 36px 18px 28px;
    }
    .hero-inner { max-width: 1180px; margin: 0 auto; position: relative; }
    .update-btn {
      position: absolute; top: 0; right: 0;
      background: var(--gold); color: #1b1408; border: 0;
      border-radius: 999px; padding: 10px 16px; font: inherit; font-weight: 700;
      cursor: pointer;
    }
    .update-btn:disabled { opacity: .6; cursor: wait; }
    .hall-form, .trip-money { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0 14px; }
    .hall-form input, .trip-money input, .filters input[type="date"] {
      border:1px solid var(--line); border-radius:10px; padding:8px 10px; font:inherit;
    }
    .split-grid { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; }
    @media (max-width:800px){ .split-grid { grid-template-columns:1fr; } }
    .add-btn {
      background: var(--gold); color:#1b1408; border:0; border-radius:999px;
      padding:10px 16px; font:inherit; font-weight:800; cursor:pointer;
    }
    .update-msg { position: absolute; top: 58px; right: 0; font-size: 12px; color: #e8d7ad; max-width: 280px; text-align: right; }
    .update-time { position: absolute; top: 40px; right: 0; font-size: 11px; color: #c9d7e4; text-align: right; }
    .eyebrow {
      letter-spacing: .16em;
      text-transform: uppercase;
      font-size: 12px;
      color: #e8d7ad;
      margin-bottom: 8px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(30px, 5vw, 48px);
      margin: 0 0 8px;
      color: #fff;
    }
    .sub { color: #e7eef5; max-width: 760px; line-height: 1.45; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 22px;
    }
    .stat {
      background: #1b3a58;
      border: 1px solid #2b5474;
      border-radius: 16px;
      padding: 16px 16px 14px;
      color: #fff;
    }
    .stat b { display: block; font-size: 26px; font-family: Fraunces, serif; color: #fff; }
    .stat span { font-size: 12px; color: #d5e3ef; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 18px 64px; }
    nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
    nav.tabs button {
      border: 0; background: #fff; color: var(--navy);
      border-radius: 999px; padding: 9px 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    nav.tabs button.active { background: var(--gold); color: #1b1408; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    select, input[type="search"] {
      border: 1px solid var(--line); background: #fff; border-radius: 12px;
      padding: 9px 12px; font: inherit; min-width: 180px; color: var(--ink);
    }
    .balance {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      background: var(--navy);
      color: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .balance .title { font-weight: 700; margin-right: 6px; color: #fff; }
    .balance .num { font-family: Fraunces, serif; font-size: 28px; color: #fff; }
    .chip {
      background: #1b3a58; color: #fff; border: 1px solid #2b5474;
      border-radius: 999px; padding: 6px 10px; font-size: 13px;
    }
    table.grid { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
    table.grid th {
      text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
      color: #d7e4ef; background: var(--navy-2); padding: 11px 10px;
    }
    table.grid th:first-child { border-radius: 12px 0 0 0; }
    table.grid th:last-child { border-radius: 0 12px 0 0; }
    table.grid td { padding: 11px 10px; border-bottom: 1px solid var(--line); background: #fff; color: var(--ink); }
    table.grid tbody tr { cursor: pointer; }
    table.grid tbody tr:hover td { background: #f4eadc; }
    table.grid tbody tr.selected td { background: #e8f1f8; }

    tr.tepl-d td { background:#fff4cc !important; font-weight:700; }
    tr.tepl-d td:first-child { background:#c9a227 !important; }
    .place-d {
      display:inline-flex; min-width:2.2em; justify-content:center;
      background:#c9a227; color:#1b1408; border-radius:999px;
      padding:3px 8px; font-weight:800;
    }

    table.grid tbody tr.planned td { color: var(--muted); }
    .pill { display: inline-flex; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
    .win { background: #dcefe3; color: var(--green); }
    .loss { background: #f6dede; color: var(--red); }
    .draw { background: #f7e7bf; color: #7a5b12; }
    .plan { background: #ece7df; color: #5b5347; }
    .home { background: #dceaf4; color: var(--blue); }
    .away { background: #f3e6cf; color: #7a5b20; }
    .detail {
      margin-top: 14px; border: 1px solid var(--line); border-radius: 16px;
      padding: 16px; background: #fff;
    }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(16,38,61,.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 18px;
    }
    .modal {
      background: #fff; border-radius: 20px; max-width: 820px; width: 100%;
      max-height: 90vh; overflow: auto; padding: 20px; box-shadow: var(--shadow);
    }
    .detail h2, .modal h2 { font-family: Fraunces, serif; margin: 0 0 6px; }
    .scoreline { font-size: 30px; font-family: Fraunces, serif; }
    .pair { border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin: 10px 0; }
    .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pair h3 { margin: 0 0 6px; font-size: 15px; }
    .lane-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .lane-table th, .lane-table td { padding: 4px 6px; border-bottom: 1px solid #efe6d8; text-align: center; }
    @media (max-width: 700px) { .pair-grid { grid-template-columns: 1fr; } }
    .muted { color: var(--muted); }
    .player-link {
      background: none; border: 0; padding: 0; font: inherit; font-weight: 700;
      color: var(--blue); cursor: pointer; text-decoration: underline;
      text-underline-offset: 3px;
    }
    .player-link:hover { color: var(--navy); }
    .card-head {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      align-items: flex-start; margin-bottom: 12px;
    }
    .back-btn {
      border: 2px solid #fff; background: var(--gold); border-radius: 999px;
      padding: 10px 16px; font: inherit; font-weight: 800; cursor: pointer; color: #1b1408;
      box-shadow: 0 2px 0 #c9a227;
    }
    .chart-btn {
      border: 2px solid #fff; background: var(--gold); border-radius: 999px;
      padding: 10px 16px; font: inherit; font-weight: 800; cursor: pointer; color: #1b1408;
      box-shadow: 0 2px 0 #c9a227;
    }
    .chart-btn.active { background: #1b3f66; color: #fff; box-shadow: none; }
    .chart-box {
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 14px 12px 8px; margin-bottom: 14px; overflow-x: auto;
    }
    .chart-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
    .season-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .season-card {
      appearance: none; border: 1px solid var(--line); background: #fff;
      border-radius: 18px; padding: 18px 14px; text-align: center; cursor: pointer;
      font: inherit; color: var(--ink); box-shadow: var(--shadow);
    }
    .season-card:hover { border-color: var(--gold); transform: translateY(-1px); }
    .season-card .yr { font-family: Fraunces, serif; font-size: 22px; margin-bottom: 8px; }
    .season-card .ratio { font-family: Fraunces, serif; font-size: 30px; color: var(--navy); }
    .season-card .place { color: var(--muted); font-size: 13px; margin-top: 8px; }
    footer { margin-top: 22px; color: var(--muted); font-size: 13px; }
    @media (max-width: 900px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <button class="update-btn" id="btnUpdate">Aktualizovat</button>
      <div class="update-time" id="updateTime"></div>
      <div class="update-msg" id="updateMsg"></div>
      <div class="eyebrow">Ústecký kraj · kuželky</div>
      <h1>TJ Teplice Letná D</h1>
      <div class="sub">Okresní přebor – skupina B. Výsledky, zápasy a statistiky hráčů od sezóny 2017/2018 do 2026/2027.</div>
      <div class="stats" id="kpi"></div>
    </div>
  </header>
  <div class="wrap">
    <nav class="tabs">
      <button class="active" data-tab="matches">Sezony</button>
      <button data-tab="stats">Statistika „D“</button>
      <button data-tab="opponents">Databáze protihráčů</button>
      <button data-tab="halls">Kuželny</button>
      <button data-tab="trips">Cesty</button>
    </nav>
    <section class="panel" id="app"></section>
    <footer>Data: kuzelky.com (2017–2026) a vysledky.kuzelky.cz (2026/2027). Aplikace funguje i offline.</footer>
  </div>
  <script src="data.js"></script>
  <script>
    const DATA = window.APP_DATA;
    const $ = (s, r=document) => r.querySelector(s);
    let tab = "matches";
    let season = "all";
    let openedSeason = null;
    let showTable = true;
    let seasonOverview = true;
    let q = "";
    let selectedId = null;
    let selectedPairHrac = null;
    let selectedPlayer = null;
    let playerSeason = "all";
    let playerVenue = "all";
    let playerOpponent = "all";
    let playerPlace = "all";
    let playerSpan = "all";
    let showChart = false;
    let oppTeam = null;
    let oppPlayer = null;
    let oppQ = "";
    let oppVenue = "all";
    let oppPlace = "all";
    let oppSpan = "all";
    let tripFrom = "01.09.2026";
    let tripTo = "31.08.2027";
    let tripSeason = "2026/2027";
    const DRIVERS = ["Markéta M.","Jana N.","Ivan K.","Karel Š.","Martin Š.","Karel B."];
    const DEFAULT_HALLS = [
      {name:"Bílina", km:15, keys:["bílina","bilina"]},
      {name:"Bohušovice", km:39, keys:["bohušovice","bohusovice"]},
      {name:"Česká Kamenice", km:62, keys:["kamenice"]},
      {name:"Duchcov", km:9, keys:["duchcov"]},
      {name:"Hvězda Trnovany", km:9, keys:["hvězda","trnovany","hvezda"]},
      {name:"Kovostroj Děčín", km:44, keys:["kovostroj"]},
      {name:"Roudnice", km:47, keys:["roudnice"]},
      {name:"SK Verneřice", km:46, keys:["verneřice","vernerice"]},
      {name:"Sokol Ústí", km:22, keys:["sokol ústí","sokol usti"]},
      {name:"TJ Lokomotiva Ústí nad Labem", km:25, keys:["lokomotiva"]},
      {name:"Union Děčín", km:42, keys:["union"]}
    ];
    function loadHalls(){
      try {
        const raw = JSON.parse(localStorage.getItem("tepliceD_halls")||"null");
        if (Array.isArray(raw) && raw.length) return raw;
      } catch(e){}
      return DEFAULT_HALLS.map(h => ({...h}));
    }
    function saveHalls(list){ localStorage.setItem("tepliceD_halls", JSON.stringify(list)); }
    function loadDrivers(){ try { return JSON.parse(localStorage.getItem("tepliceD_drivers")||"{}"); } catch(e){ return {}; } }
    function saveDrivers(m){ localStorage.setItem("tepliceD_drivers", JSON.stringify(m)); }
    function loadMoney(){ try { return JSON.parse(localStorage.getItem("tepliceD_money")||"{}"); } catch(e){ return {}; } }
    function saveMoney(m){ localStorage.setItem("tepliceD_money", JSON.stringify(m)); }
    let halls = loadHalls();
    let tripDrivers = loadDrivers();
    let tripMoneyMap = loadMoney();
    function moneyKey(){ return tripFrom+"|"+tripTo; }
    function hallOf(m){
      const blob = ((m.kuzelna||"")+" "+(m.souper||"")).toLowerCase();
      return halls.find(h => (h.keys||[]).some(k => blob.includes(k)) || blob.includes((h.name||"").toLowerCase())) || null;
    }
    function toInputDate(dmy){
      const p=String(dmy||"").split(".");
      if(p.length<3) return "";
      return `${p[2].padStart(4,"0")}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
    }
    function fromInputDate(iso){
      const p=String(iso||"").split("-");
      if(p.length<3) return "";
      return Number(p[2])+"."+Number(p[1])+"."+p[0];
    }

    function played(m){ return String(m.odehrano).toLowerCase() === "ano" && m.vysledek; }
    function resultClass(m){
      const a = Number(m.body_td), b = Number(m.body_opp);
      if (!played(m) || Number.isNaN(a) || Number.isNaN(b)) return "plan";
      if (a > b) return "win";
      if (a < b) return "loss";
      return "draw";
    }
    function resultLabel(m){
      const c = resultClass(m);
      return c === "win" ? "výhra" : c === "loss" ? "prohra" : c === "draw" ? "remíza" : "naplánováno";
    }
    function pairingResult(row){
      const a = Number(row.soucet), b = Number(row.souper_soucet);
      if (Number.isFinite(a) && Number.isFinite(b)) {
        return a>b ? "výhra" : a<b ? "prohra" : "remíza";
      }
      if (row.vysledek === "výhra" || row.vysledek === "prohra" || row.vysledek === "remíza") return row.vysledek;
      const mid = row.id_zapasu;
      const peers = (DATA.opp||[]).filter(x => String(x.id_zapasu)===String(mid) && x.hrac!==row.hrac && Number.isFinite(Number(x.soucet)));
      if (peers.length){
        const c = Number(peers[0].soucet);
        if (Number.isFinite(a) && Number.isFinite(c)) return a>c ? "výhra" : a<c ? "prohra" : "remíza";
      }
      const sb = Number(row.sb);
      if (sb >= 2) return "výhra";
      if (sb === 0) return "prohra";
      return "—";
    }
    function matchByPerf(p){
      return DATA.matches.find(m => String(m.id)===String(p.id_zapasu))
        || DATA.matches.find(m => m.rocnik===p.rocnik && Number(m.kolo)===Number(p.kolo));
    }
        function noteFor(p){
      if (!p) return "";
      if (p.poznamka) return p.poznamka;
      const row=(DATA.players||[]).find(x => x.hrac===p.hrac && (String(x.id_zapasu)===String(p.id_zapasu) || (x.datum===p.datum && x.rocnik===p.rocnik)));
      return (row && row.poznamka) || "";
    }
function matchModalHtml(selected){
      if (!selected) return "";
      const detPlayers = DATA.players.filter(x => String(x.id_zapasu)===String(selected.id) || (x.rocnik===selected.rocnik && Number(x.kolo)===Number(selected.kolo) && /Teplice Letná D/.test(x.souper||selected.souper||"")));
      const own = DATA.players.filter(x => String(x.id_zapasu)===String(selected.id) || (selected.rocnik && x.rocnik===selected.rocnik && Number(x.kolo)===Number(selected.kolo)));
      let people = own.length ? own : (DATA.opp||[]).filter(x => String(x.id_zapasu)===String(selected.id));
      if (selectedPairHrac) people = people.filter(x => x.hrac===selectedPairHrac || x.souper_hrac===selectedPairHrac);
      if (selectedPairHrac && !people.length) {
        people = (DATA.opp||[]).filter(x => x.hrac===selectedPairHrac && (String(x.id_zapasu)===String(selected.id) || (x.rocnik===selected.rocnik && Number(x.kolo)===Number(selected.kolo))));
        people = people.map(x => {
          const partner = (DATA.opp||[]).find(y => String(y.id_zapasu)===String(x.id_zapasu) && y.hrac!==x.hrac) || {};
          return Object.assign({}, x, {souper_hrac: partner.hrac, souper_soucet: partner.soucet, souper_plne: partner.plne, souper_dorazka: partner.dorazka, souper_chyby: partner.chyby, souper_sb: partner.sb, souper_drahy: partner.drahy});
        });
      }
      people = people.map(x => {
        if (x.souper_hrac) return x;
        const partner = (DATA.opp||[]).find(y => String(y.id_zapasu)===String(x.id_zapasu) && y.hrac!==x.hrac) || {};
        if (!partner.hrac) return x;
        return Object.assign({}, x, {souper_hrac: partner.hrac, souper_soucet: partner.soucet, souper_plne: partner.plne, souper_dorazka: partner.dorazka, souper_chyby: partner.chyby, souper_sb: partner.sb, souper_drahy: partner.drahy});
      });
      const laneHead = `<tr><th>Dráha</th><th>P</th><th>D</th><th>Ch</th><th>Σ</th><th>SB</th></tr>`;
      const laneRows = (arr) => (arr&&arr.length?arr.map(dr => `<tr><td>${dr.draha}</td><td>${dr.plne}</td><td>${dr.dorazka}</td><td>${dr.chyby}</td><td>${dr.soucet}</td><td><b>${dr.sb ?? "—"}</b></td></tr>`).join(""):`<tr><td colspan="6" class="muted">Bez rozpisu drah</td></tr>`);
      return `<div class="modal-bg" id="matchModal">
            <div class="modal">
              <div class="card-head">
                <h2>${selected.tym || "TJ Teplice Letná D"} vs ${selected.souper || ""}</h2>
                <button class="back-btn" id="closeMatch">Zavřít</button>
              </div>
              <div class="muted">${selected.rocnik || ""} · ${selected.kolo || ""}. kolo · ${selected.datum || ""} ${selected.cas || ""}</div>
              <p><span class="pill ${selected.misto==="doma"?"home":"away"}">${selected.misto==="doma"?"DOMA":selected.misto==="venku"?"VENKU":(selected.misto||"—")}</span>
              · Kuželna ${selected.kuzelna || "—"}</p>
              
              ${people.map(pr => {
                const res = pairingResult(pr);
                return `<div class="pair"><div class="pair-grid">
                  <div>
                    <h3>${pr.hrac} ${noteFor(pr)?`<span class="muted" style="font-size:14px;font-weight:700">${noteFor(pr)}</span>`:""} <span class="pill ${res==="výhra"?"win":res==="prohra"?"loss":"draw"}">${res}</span></h3>
                    <div class="scoreline" style="font-size:28px">${pr.soucet ?? "—"}</div>
                    <p>P ${pr.plne ?? "—"} · D ${pr.dorazka ?? "—"} · Ch ${pr.chyby ?? "—"} · SB ${pr.sb ?? "—"}</p>
                    <table class="grid">${laneHead}${laneRows(pr.drahy)}</table>
                  </div>
                  <div>
                    <h3>${pr.souper_hrac || pr.souper || "Soupeř"}</h3>
                    <div class="scoreline" style="font-size:28px">${pr.souper_soucet ?? "—"}</div>
                    <p>P ${pr.souper_plne ?? "—"} · D ${pr.souper_dorazka ?? "—"} · Ch ${pr.souper_chyby ?? "—"} · SB ${pr.souper_sb ?? "—"}</p>
                    <table class="grid">${laneHead}${laneRows(pr.souper_drahy)}</table>
                  </div>
                </div></div>`;
              }).join("")}

    function renderLeagueTable(rocnik){
      const rows = ((DATA.tables && DATA.tables[rocnik]) || LEAGUE_TABLES[rocnik] || []).filter(r => r.tym && !/volný los/i.test(r.tym));
      if (!rows.length) return `<p class="muted">Konečná tabulka ročníku ${rocnik} se z kuzelky.com teď nenačetla (web tabulky plní jen v prohlížeči). Zkuste <a href="https://kuzelky.com/index.php?poi=tabul" target="_blank">kuzelky.com – Tabulka</a>.</p>`;
      return `<div style="overflow:auto"><table class="grid">
        <thead><tr><th>#</th><th>Tým</th><th>Z</th><th>V</th><th>R</th><th>P</th><th>Skóre</th><th>SB</th><th>Ø</th><th>B</th><th>+/−</th></tr></thead>
        <tbody>${rows.map((r,i) => {
          const mine=/Teplice Letná D/.test(r.tym);
          return `<tr class="${mine?"selected tepl-d":""}">
          <td>${mine?`<span class="place-d">${i+1}.</span>`:`${i+1}.`}</td><td><b>${r.tym}</b></td><td>${r.z}</td><td>${r.v}</td><td>${r.r}</td><td>${r.p2}</td>
          <td>${r.skore}</td><td>${r.sb}</td><td>${r.avg}</td><td><b>${r.b}</b></td><td>${r.diff}</td>
        </tr>`;
        }).join("")}</tbody>
      </table></div>`;
    }

    function parseDate(d){
      const p = String(d||"").split(".");
      if (p.length < 3) return 0;
      return Date.UTC(p[2], Number(p[1])-1, Number(p[0]));
    }
    const seasons = [...new Set(DATA.matches.map(m => m.rocnik))].sort().reverse();
    const allMatches = [...DATA.matches].sort((a,b) => {
      const da = parseDate(a.datum) - parseDate(b.datum);
      return da || Number(a.kolo) - Number(b.kolo);
    });

    function kpis(){
      const playedMs = allMatches.filter(played);
      const w = playedMs.filter(m => resultClass(m)==="win").length;
      const d = playedMs.filter(m => resultClass(m)==="draw").length;
      const l = playedMs.filter(m => resultClass(m)==="loss").length;
      $("#kpi").innerHTML = `
        <div class="stat"><b>${DATA.meta.rocniky}</b><span>ročníky</span></div>
        <div class="stat"><b>${playedMs.length}</b><span>odehraných zápasů</span></div>
        <div class="stat"><b>${w}–${d}–${l}</b><span>výhry – remízy – prohry</span></div>
        <div class="stat"><b>${DATA.stats.length}</b><span>hráčů v databázi</span></div>`;
    }

    function seasonMatches(){
      return season === "all" ? allMatches : allMatches.filter(m => m.rocnik === season);
    }
    function pinAvg(list, where){
      const pins = list.filter(played)
        .filter(m => !where || m.misto === where)
        .map(m => Number(m.kuzelky_td)).filter(n => n > 0);
      return pins.length ? Math.round(pins.reduce((a,b)=>a+b,0)/pins.length) : "—";
    }
    function balanceHtml(list){
      const p = list.filter(played);
      const w = p.filter(m => resultClass(m)==="win").length;
      const d = p.filter(m => resultClass(m)==="draw").length;
      const l = p.filter(m => resultClass(m)==="loss").length;
      const label = season === "all" ? "Všechny ročníky" : season;
      return `<div class="balance">
        <div class="title">${label}</div>
        <div class="num">${w}–${d}–${l}</div>
        <span class="chip">průměr doma ${pinAvg(list,"doma")}</span>
        <span class="chip">průměr venku ${pinAvg(list,"venku")}</span>
      </div>`;
    }

    const PLACEMENT = Object.assign({
      "2026/2027": "8. místo",

      "2022/2023": "9. místo",

      "2018/2019": "13. místo",
      "2017/2018": "12. místo"
    }, (DATA.meta && DATA.meta.umisteni) || {});
    function seasonRecord(year){
      const list = allMatches.filter(m => m.rocnik === year);
      const p = list.filter(played);
      return {
        list,
        w: p.filter(m => resultClass(m)==="win").length,
        d: p.filter(m => resultClass(m)==="draw").length,
        l: p.filter(m => resultClass(m)==="loss").length,
        place: PLACEMENT[year] || "umístění neuvedeno"
      };
    }
    function renderSeasonCards(){

            <div class="ratio">${r.w}–${r.d}–${r.l}</div>
            <div class="place">${r.place}</div>
          </button>`;
        }).join("")}
      </div>`;
    }
    function latestSeason(){
      const ys=[...new Set((DATA.matches||[]).map(m=>m.rocnik).filter(Boolean))];
      ys.sort((a,b)=>String(b).localeCompare(String(a)));

        ${selected && !showTable ? `

              ${detPlayers.map(p => {

    function playerKey(p){ return String(p.id_hrace || p.id || p.hrac); }
    function performancesOf(player){
      const id = player.id || player.id_hrace;
      return DATA.players.filter(x => !x.mimo_statistiky && ((id && String(x.id_hrace) === String(id)) || x.hrac === player.hrac));
    }
    function summarize(list){
      const nums = list.map(x => Number(x.soucet)).filter(n => !Number.isNaN(n));
      const w = list.filter(x => x.vysledek === "výhra").length;
      const l = list.filter(x => x.vysledek === "prohra").length;
      const d = list.filter(x => x.vysledek === "remíza").length;
      const avg = nums.length ? (nums.reduce((a,b)=>a+b,0)/nums.length) : 0;
      const max = nums.length ? Math.max(...nums) : null;
      const min = nums.length ? Math.min(...nums) : null;
      const plne = list.map(x => Number(x.plne)).filter(n => !Number.isNaN(n));
      const dor = list.map(x => Number(x.dorazka)).filter(n => !Number.isNaN(n));
      const chy = list.map(x => Number(x.chyby)).filter(n => !Number.isNaN(n));
      return {
        starty: list.length, avg, max, min, w, l, d,
        plne: plne.reduce((a,b)=>a+b,0),
        dor: dor.reduce((a,b)=>a+b,0),
        chy: chy.reduce((a,b)=>a+b,0)
      };
    }
    function barColor(p){
      if (p.vysledek === "výhra") return "#1f6d42";
      if (p.vysledek === "prohra") return "#a83232";
      if (p.vysledek === "remíza") return "#c9a45a";
      return "#215d86";
    }
    function renderPlayerChart(list){
      const rows = list.filter(p => p.soucet != null && p.soucet !== "").slice().reverse();
      if (!rows.length) return `<div class="chart-box muted">Pro zvolený filtr nejsou číselné výkony k vykreslení.</div>`;
      const w = Math.max(560, rows.length * 28);
      const h = 260, padL = 36, padB = 58, padT = 24, padR = 12;
      const vals = rows.map(p => Number(p.soucet) || 0);
      const minPerf = Math.min(...vals);
      const maxPerf = Math.max(...vals);
      const minV = minPerf - 10;
      const maxV = maxPerf + 10;
      const span = Math.max(1, maxV - minV);
      const innerW = w - padL - padR;
      const innerH = h - padT - padB;
      const gap = rows.length > 20 ? 2 : 4;
      const barW = Math.max(8, innerW / rows.length - gap);
      const yFor = v => padT + innerH - ((v - minV) / span) * innerH;
      const ticks = [minV, Math.round(minV + span * 0.25), Math.round(minV + span * 0.5), Math.round(minV + span * 0.75), maxV];
      const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
      const bars = rows.map((p,i) => {
        const x = padL + i * (barW + gap);
        const y = yFor(Number(p.soucet)||0);
        const bh = padT + innerH - y;
        const title = `${p.datum} · ${p.rocnik} · ${p.kolo}. kolo · ${p.soucet} · ${p.kuzelna||""}`;
        const label = `${p.kolo}`;
        return `<g>
          <rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="3" fill="${barColor(p)}">
            <title>${title}</title>
          </rect>
          <text x="${x + barW/2}" y="${h-36}" text-anchor="middle" font-size="9" fill="#4e5b6a" transform="rotate(-55 ${x + barW/2} ${h-36})">${p.datum}</text>
        </g>`;
      }).join("");
      return `<div class="chart-box">
        <svg viewBox="0 0 ${w} ${h}" width="100%" height="280" role="img" aria-label="Sloupcový graf výkonů">
          ${ticks.map(t => `<g>
            <line x1="${padL}" x2="${w-padR}" y1="${yFor(t)}" y2="${yFor(t)}" stroke="#eadfcf"/>
            <text x="${padL-6}" y="${yFor(t)+4}" text-anchor="end" font-size="10" fill="#4e5b6a">${t}</text>
          </g>`).join("")}
          <line x1="${padL}" x2="${w-padR}" y1="${yFor(avg)}" y2="${yFor(avg)}" stroke="#10263d" stroke-dasharray="4 4"/>
          ${bars}
        </svg>
        <div class="chart-legend">
          <span>sloupce = součet kuželek</span>
          <span style="color:#1f6d42">■ výhra</span>
          <span style="color:#a83232">■ prohra</span>
          <span style="color:#c9a45a">■ remíza</span>
          <span>tečkovaná čára = průměr ${Math.round(avg)}</span>
          <span>rozsah ${minV}–${maxV} (nejhorší −10 / nejlepší +10)</span>
        </div>
      </div>`;
    }

    function awayInRange(){
      const a=parseDate(tripFrom), b=parseDate(tripTo);
      return allMatches.filter(m => {
        if (m.misto!=="venku") return false;
        const hall=(m.kuzelna||"")+" "+(m.souper||"");
        if (/Teplice Letná/i.test(hall)) return false;
        const d=parseDate(m.datum);
        return d>=a && d<=b;
      }).sort((x,y)=>parseDate(x.datum)-parseDate(y.datum));
    }
    function matchTripKm(m){
      const h=hallOf(m);
      return h ? 2*(Number(h.km)||0) : 0;
    }
    function seasonAwayMatches(rocnik){
      return allMatches.filter(m => {
        if (m.misto!=="venku") return false;
        if (rocnik && m.rocnik!==rocnik) return false;
        const hall=(m.kuzelna||"")+" "+(m.souper||"");
        if (/Teplice Letná/i.test(hall)) return false;
        return true;
      }).sort((x,y)=>parseDate(x.datum)-parseDate(y.datum));

    function renderTrips(){
      const seasons=[...new Set((DATA.matches||[]).map(m=>m.rocnik).filter(Boolean))].sort((a,b)=>String(b).localeCompare(String(a)));
      if (!tripSeason || !seasons.includes(tripSeason)) tripSeason = seasons[0] || tripSeason;
      const seasonList=seasonAwayMatches(tripSeason);
      const list=awayInRange().filter(m => !tripSeason || m.rocnik===tripSeason);
      const seasonKm=seasonList.reduce((a,m)=>a+matchTripKm(m),0);
      const sums={}; DRIVERS.forEach(n=>sums[n]=0);
      list.forEach(m=>{
        const who=tripDrivers[m.id];
        if(who) sums[who]+=matchTripKm(m);
      });
      const assignedKm=Object.values(sums).reduce((a,b)=>a+b,0);
      const budget=Number(tripMoneyMap[tripSeason]||tripMoneyMap[moneyKey()]||0);
      const perKm = seasonKm && budget ? budget / seasonKm : 0;
      const perKmShow = perKm ? Math.round(perKm) : 0;
      return `<div class="filters">
          <label>Sezona <select id="tripSeason">${seasons.map(s=>`<option value="${s}" ${s===tripSeason?"selected":""}>${s}</option>`).join("")}</select></label>

    function normTeam(s){
      return String(s||"").replace(/\s+/g," ").replace(/Sokol Ústí nad Labem/g,"Sokol Ústí n. L.").replace(/Sokol Roudnice n\. L\./g,"Sokol Roudnice nad Labem").trim();
    }
    async function fetchHtml(url){
      const attempts = [
        "https://api.allorigins.win/get?url=" + encodeURIComponent(url),
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
        "https://r.jina.ai/http://" + url.replace(/^https?:\/\//,""),
        url
      ];
      let lastErr;
      for (const u of attempts){
        try {
          const res = await fetch(u, {mode:"cors"});
          if (!res.ok) throw new Error("HTTP "+res.status);
          const raw = await res.text();
          let html = raw;
          if (raw.trim().startsWith("{")) {
            try { const j=JSON.parse(raw); html = j.contents || j.body || raw; } catch(e){}
          }
          if (html && html.length > 400 && /kuzelky|Teplice|TABULKA|kolo/i.test(html)) return html;
        } catch(e){ lastErr = e; }
      }
      throw lastErr || new Error("nelze načíst");
    }
    function parsePlace(html){
      const t = html.replace(/<[^>]+>/g," ").replace(/\s+/g," ");
      const m = t.match(/(\d+)\.\s*TJ Teplice Letná D/);
      return m ? (m[1] + ". místo") : null;
    }
    function parseAllMatches(html, kolo){
      const text = html.replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<[^>]+>/g," ").replace(/\u00a0/g," ").replace(/\s+/g," ");
      const links = [...html.matchAll(/detail-zapasu\/(okresni-prebor-b-2026-2027-kolo-\d+-[a-z0-9-]+-muzi-[a-z0-9-]+-muzi)/g)].map(x=>x[1]);
      const out=[];
      const re = /(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})\s+(\d{1,2}:\d{2})\s+(.+?)\s+(?:(\d{3,5})\s+([0-6])\s+([0-6])\s+(\d{3,5})\s+)?(.+?)(?=\s+\d{1,2}\.\s*\d{1,2}\.\s*\d{4}|\s+Video\s|\s+Soupisky|\s+TABULKA|$)/g;
      let m, i=0;
      while ((m = re.exec(text))){
        const home = normTeam(m[5]).replace(/\.$/,"").replace(/(.+)\s+\1/,"$1").trim();
        const away = normTeam(m[10]).replace(/\.$/,"").replace(/(.+)\s+\1/,"$1").trim();
        if (!home || !away || home.length>60 || away.length>60) continue;
        const row = {
          kolo:Number(kolo),
          datum: Number(m[1])+"."+Number(m[2])+"."+m[3],
          cas:m[4], home, away,
          slug: links[i] || null
        };
        if (m[6]!=null){
          row.played=true;
          row.kuzelky_home=Number(m[6]); row.body_home=Number(m[7]);
          row.body_away=Number(m[8]); row.kuzelky_away=Number(m[9]);
        } else row.played=false;
        out.push(row); i++;
      }
      return out;
    }
    function lastPlayedTeplice(){
      const list = DATA.matches.filter(m => m.rocnik==="2026/2027" && played(m));
      list.sort((a,b)=>parseDate(a.datum)-parseDate(b.datum));
      return list.length ? list[list.length-1] : null;
    }
    function rebuildStats(){
      const map = {};
      DATA.players.forEach(p => {
        if (p.mimo_statistiky) return;
        const k = p.hrac;
        if (!k) return;
        if (!map[k]) map[k] = {poradi:0,hrac:k,id:p.id_hrace,rocniky:new Set(),kuzelny:new Set(),starty:0,doma:0,venku:0,soucet:0,plne:0,dorazka:0,chyby:0,max:0,min:9999,vyhry:0,prohry:0,remizy:0};
        const s=map[k];
        s.starty++;
        if (p.rocnik) s.rocniky.add(p.rocnik);
        if (p.kuzelna) s.kuzelny.add(p.kuzelna);
        if (p.misto==="doma") s.doma++; else if (p.misto==="venku") s.venku++;
        const sc=Number(p.soucet)||0;
        s.soucet+=sc; s.plne+=Number(p.plne)||0; s.dorazka+=Number(p.dorazka)||0; s.chyby+=Number(p.chyby)||0;
        if (sc>s.max) s.max=sc;
        if (sc && sc<s.min) s.min=sc;
        if (p.vysledek==="výhra") s.vyhry++;
        else if (p.vysledek==="prohra") s.prohry++;
        else if (p.vysledek==="remíza") s.remizy++;
      });
      DATA.stats = Object.values(map).map(s => ({
        ...s,
        rocniky:[...s.rocniky].sort().join(", "),
        kuzelna:[...s.kuzelny].join(", "),
        prumer: s.starty? s.soucet/s.starty : 0,
        min: s.min===9999?0:s.min,
        pct: s.starty? s.vyhry/s.starty : 0
      })).sort((a,b)=>(b.starty-a.starty)||a.hrac.localeCompare(b.hrac,"cs"));
    }
    function parseDetailPlayers(html, meta){
      const names=[];
      for (const m of html.matchAll(/detail-hrace\/[^"]+">([^<]+)/g)){
        const n=m[1].trim();
        if (n && !names.includes(n)) names.push(n);
      }
      const tables=[];
      const tre=/<table[\s\S]*?<\/table>/gi;
      let tm;
      while ((tm=tre.exec(html))){
        const rows=[];
        const rr=/<tr[\s\S]*?<\/tr>/gi;
        let r;
        while ((r=rr.exec(tm[0]))){
          const cells=[...r[0].matchAll(/<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi)].map(c=>c[1].replace(/<[^>]+>/g,"").trim());
          if (cells.length) rows.push(cells);
        }
        if (rows[0] && rows[0].length>=14) tables.push(rows);
      }
      const pairs=[];
      for (let i=0;i+1<names.length && pairs.length<tables.length;i+=2){
        const row = tables[pairs.length][1] || [];
        const take=(off)=>({
          plne:Number(row[off+1]||0), dorazka:Number(row[off+2]||0), chyby:Number(row[off+3]||0),
          soucet:Number(row[off+4]||0), sb:Number(row[off+5]||0)
        });
        pairs.push({home:names[i], away:names[i+1], hs:take(0), as:take(8)});
      }
      return pairs;
    }

              patch.players.push({

                vysledek:res
              });
            });
          }
          (row.pairs||[]).forEach((pr,idx)=>{
            const mid=row.slug||("OPB-2026-27-K"+row.kolo+"-"+idx);
            const kuz = hallOf({kuzelna:"",souper:row.home})?.name || row.home;
            patch.opp.push({rocnik:"2026/2027",kolo:row.kolo,id_zapasu:mid,datum:row.datum,tym:row.home,souper:row.away,hrac:pr.home,soucet:pr.hs.soucet,plne:pr.hs.plne,dorazka:pr.hs.dorazka,chyby:pr.hs.chyby,sb:pr.hs.sb,misto:"doma",kuzelna:kuz});
            patch.opp.push({rocnik:"2026/2027",kolo:row.kolo,id_zapasu:mid,datum:row.datum,tym:row.away,souper:row.home,hrac:pr.away,soucet:pr.as.soucet,plne:pr.as.plne,dorazka:pr.as.dorazka,chyby:pr.as.chyby,sb:pr.as.sb,misto:"venku",kuzelna:kuz});
          });
        }
        patch.matches.forEach(p => {
          const m = DATA.matches.find(x => x.rocnik==="2026/2027" && Number(x.kolo)===Number(p.kolo));
          if (m) Object.assign(m, p);
        });
        const pkey = r => r.hrac+"|"+r.datum+"|"+r.soucet;
        const haveP = new Set(DATA.players.map(pkey));
        patch.players.forEach(r => { if (!haveP.has(pkey(r))) { DATA.players.push(r); haveP.add(pkey(r)); } });
        const okey = r => [r.rocnik,r.hrac,r.datum,r.soucet,r.tym].join("|");
        const haveO = new Set((DATA.opp||[]).map(okey));
        DATA.opp = DATA.opp || [];
        patch.opp.forEach(r => { if (!haveO.has(okey(r))) { DATA.opp.push(r); haveO.add(okey(r)); } });
        rebuildStats();
        if (patch.place) {
          DATA.meta = DATA.meta || {};
          DATA.meta.umisteni = Object.assign({}, DATA.meta.umisteni, {"2026/2027": patch.place});
          Object.assign(PLACEMENT, DATA.meta.umisteni);
        }
        const now = new Date();
        const ts = now.toLocaleString("cs-CZ", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
        localStorage.setItem("tepliceD_lastUpdate", ts);
        localStorage.setItem("tepliceD_resultPatch", JSON.stringify(patch));
        showLastUpdate();
        msg.textContent = "Od "+(last?last.datum:"začátku")+" do dnes: zápasů D "+patch.matches.length+", výkonů D "+patch.players.length+", protihráčů "+patch.opp.length+(patch.place?(" · "+patch.place):"");
      } catch (e) {
        msg.textContent = "Aktualizace selhala ("+(e && e.message ? e.message : "síť")+"). Potřeba https stránka.";
      }
      render();
      showLastUpdate();
      btn.disabled = false;
    }
    applySavedResults();
    showLastUpdate();
    $("#btnUpdate").onclick = aktualizovat;
  </script>
</body>
</html>
