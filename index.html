<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Teplice D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#10263d" />
  <link rel="manifest" href="manifest.json" />
  <title>TJ Teplice Letná D — Okresní přebor B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #10263d;
      --navy-2: #17344f;
      --ink: #172230;
      --muted: #4e5b6a;
      --paper: #efe7da;
      --card: #fffcf7;
      --line: #ddd1bf;
      --gold: #c9a45a;
      --green: #1f6d42;
      --red: #a83232;
      --blue: #215d86;
      --shadow: 0 8px 24px rgba(16,38,61,.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    .hero {
      background: var(--navy);
      color: #fff;
      padding: 36px 18px 28px;
    }
    .hero-inner { max-width: 1180px; margin: 0 auto; position: relative; }
    .update-btn {
      position: absolute; top: 0; right: 0;
      background: var(--gold); color: #1b1408; border: 0;
      border-radius: 999px; padding: 10px 16px; font: inherit; font-weight: 700;
      cursor: pointer;
    }
    .update-btn:disabled { opacity: .6; cursor: wait; }
    .hall-form, .trip-money { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0 14px; }
    .hall-form input, .trip-money input, .filters input[type="date"] {
      border:1px solid var(--line); border-radius:10px; padding:8px 10px; font:inherit;
    }
    .split-grid { display:grid; grid-template-columns:1.2fr .8fr; gap:16px; }
    @media (max-width:800px){ .split-grid { grid-template-columns:1fr; } }
    .add-btn {
      background: var(--gold); color:#1b1408; border:0; border-radius:999px;
      padding:10px 16px; font:inherit; font-weight:800; cursor:pointer;
    }
    .update-msg { position: absolute; top: 58px; right: 0; font-size: 12px; color: #e8d7ad; max-width: 280px; text-align: right; }
    .update-time { position: absolute; top: 40px; right: 0; font-size: 11px; color: #c9d7e4; text-align: right; }
    .eyebrow {
      letter-spacing: .16em;
      text-transform: uppercase;
      font-size: 12px;
      color: #e8d7ad;
      margin-bottom: 8px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(30px, 5vw, 48px);
      margin: 0 0 8px;
      color: #fff;
    }
    .sub { color: #e7eef5; max-width: 760px; line-height: 1.45; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 22px;
    }
    .stat {
      background: #1b3a58;
      border: 1px solid #2b5474;
      border-radius: 16px;
      padding: 16px 16px 14px;
      color: #fff;
    }
    .stat b { display: block; font-size: 26px; font-family: Fraunces, serif; color: #fff; }
    .stat span { font-size: 12px; color: #d5e3ef; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 18px 18px 64px; }
    nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
    nav.tabs button {
      border: 0; background: #fff; color: var(--navy);
      border-radius: 999px; padding: 9px 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    nav.tabs button.active { background: var(--gold); color: #1b1408; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    select, input[type="search"] {
      border: 1px solid var(--line); background: #fff; border-radius: 12px;
      padding: 9px 12px; font: inherit; min-width: 180px; color: var(--ink);
    }
    .balance {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      background: var(--navy);
      color: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .balance .title { font-weight: 700; margin-right: 6px; color: #fff; }
    .balance .num { font-family: Fraunces, serif; font-size: 28px; color: #fff; }
    .chip {
      background: #1b3a58; color: #fff; border: 1px solid #2b5474;
      border-radius: 999px; padding: 6px 10px; font-size: 13px;
    }
    table.grid { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
    table.grid th {
      text-align: left; font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
      color: #d7e4ef; background: var(--navy-2); padding: 11px 10px;
    }
    table.grid th:first-child { border-radius: 12px 0 0 0; }
    table.grid th:last-child { border-radius: 0 12px 0 0; }
    table.grid td { padding: 11px 10px; border-bottom: 1px solid var(--line); background: #fff; color: var(--ink); }
    table.grid tbody tr { cursor: pointer; }
    table.grid tbody tr:hover td { background: #f4eadc; }
    table.grid tbody tr.selected td { background: #e8f1f8; }
    table.grid tbody tr.planned td { color: var(--muted); }
    .pill { display: inline-flex; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
    .win { background: #dcefe3; color: var(--green); }
    .loss { background: #f6dede; color: var(--red); }
    .draw { background: #f7e7bf; color: #7a5b12; }
    .plan { background: #ece7df; color: #5b5347; }
    .home { background: #dceaf4; color: var(--blue); }
    .away { background: #f3e6cf; color: #7a5b20; }
    .detail {
      margin-top: 14px; border: 1px solid var(--line); border-radius: 16px;
      padding: 16px; background: #fff;
    }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(16,38,61,.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 18px;
    }
    .modal {
      background: #fff; border-radius: 20px; max-width: 820px; width: 100%;
      max-height: 90vh; overflow: auto; padding: 20px; box-shadow: var(--shadow);
    }
    .detail h2, .modal h2 { font-family: Fraunces, serif; margin: 0 0 6px; }
    .scoreline { font-size: 30px; font-family: Fraunces, serif; }
    .pair { border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin: 10px 0; }
    .pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pair h3 { margin: 0 0 6px; font-size: 15px; }
    .lane-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .lane-table th, .lane-table td { padding: 4px 6px; border-bottom: 1px solid #efe6d8; text-align: center; }
    @media (max-width: 700px) { .pair-grid { grid-template-columns: 1fr; } }
    .muted { color: var(--muted); }
    .player-link {
      background: none; border: 0; padding: 0; font: inherit; font-weight: 700;
      color: var(--blue); cursor: pointer; text-decoration: underline;
      text-underline-offset: 3px;
    }
    .player-link:hover { color: var(--navy); }
    .card-head {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      align-items: flex-start; margin-bottom: 12px;
    }
    .back-btn {
      border: 2px solid #fff; background: var(--gold); border-radius: 999px;
      padding: 10px 16px; font: inherit; font-weight: 800; cursor: pointer; color: #1b1408;
      box-shadow: 0 2px 0 #c9a227;
    }
    .chart-btn {
      border: 2px solid #fff; background: var(--gold); border-radius: 999px;
      padding: 10px 16px; font: inherit; font-weight: 800; cursor: pointer; color: #1b1408;
      box-shadow: 0 2px 0 #c9a227;
    }
    .chart-btn.active { background: #1b3f66; color: #fff; box-shadow: none; }
    .chart-box {
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 14px 12px 8px; margin-bottom: 14px; overflow-x: auto;
    }
    .chart-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
    .season-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .season-card {
      appearance: none; border: 1px solid var(--line); background: #fff;
      border-radius: 18px; padding: 18px 14px; text-align: center; cursor: pointer;
      font: inherit; color: var(--ink); box-shadow: var(--shadow);
    }
    .season-card:hover { border-color: var(--gold); transform: translateY(-1px); }
    .season-card .yr { font-family: Fraunces, serif; font-size: 22px; margin-bottom: 8px; }
    .season-card .ratio { font-family: Fraunces, serif; font-size: 30px; color: var(--navy); }
    .season-card .place { color: var(--muted); font-size: 13px; margin-top: 8px; }
    footer { margin-top: 22px; color: var(--muted); font-size: 13px; }
    @media (max-width: 900px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <button class="update-btn" id="btnUpdate">Aktualizovat</button>
      <div class="update-time" id="updateTime"></div>
      <div class="update-msg" id="updateMsg"></div>
      <div class="eyebrow">Ústecký kraj · kuželky</div>
      <h1>TJ Teplice Letná D</h1>
      <div class="sub">Okresní přebor – skupina B. Výsledky, zápasy a statistiky hráčů od sezóny 2017/2018 do 2026/2027.</div>
      <div class="stats" id="kpi"></div>
    </div>
  </header>
  <div class="wrap">
    <nav class="tabs">
      <button class="active" data-tab="matches">Zápasy</button>
      <button data-tab="stats">Statistika „D“</button>
      <button data-tab="opponents">Databáze protihráčů</button>
      <button data-tab="halls">Kuželny</button>
      <button data-tab="trips">Cesty</button>
    </nav>
    <section class="panel" id="app"></section>
    <footer>Data: kuzelky.com (2017–2026) a vysledky.kuzelky.cz (2026/2027). Aplikace funguje i offline.</footer>
  </div>
  <script src="data.js"></script>
  <script>
    const DATA = window.APP_DATA;
    const $ = (s, r=document) => r.querySelector(s);
    let tab = "matches";
    let season = "all";
    let openedSeason = null;
    let q = "";
    let selectedId = null;
    let selectedPlayer = null;
    let playerSeason = "all";
    let playerVenue = "all";
    let playerPlace = "all";
    let playerSpan = "all";
    let showChart = false;
    let oppTeam = null;
    let oppPlayer = null;
    let oppQ = "";
    let oppVenue = "all";
    let oppPlace = "all";
    let oppSpan = "all";
    let tripFrom = "01.09.2026";
    let tripTo = "31.08.2027";
    const DRIVERS = ["Markéta M.","Jana N.","Ivan K.","Karel Š.","Martin Š.","Karel B."];
    const DEFAULT_HALLS = [
      {name:"Bílina", km:15, keys:["bílina","bilina"]},
      {name:"Bohušovice", km:39, keys:["bohušovice","bohusovice"]},
      {name:"Česká Kamenice", km:62, keys:["kamenice"]},
      {name:"Duchcov", km:9, keys:["duchcov"]},
      {name:"Hvězda Trnovany", km:9, keys:["hvězda","trnovany","hvezda"]},
      {name:"Kovostroj Děčín", km:44, keys:["kovostroj"]},
      {name:"Roudnice", km:47, keys:["roudnice"]},
      {name:"SK Verneřice", km:46, keys:["verneřice","vernerice"]},
      {name:"Sokol Ústí", km:22, keys:["sokol ústí","sokol usti"]},
      {name:"TJ Lokomotiva Ústí nad Labem", km:25, keys:["lokomotiva"]},
      {name:"Union Děčín", km:42, keys:["union"]}
    ];
    function loadHalls(){
      try {
        const raw = JSON.parse(localStorage.getItem("tepliceD_halls")||"null");
        if (Array.isArray(raw) && raw.length) return raw;
      } catch(e){}
      return DEFAULT_HALLS.map(h => ({...h}));
    }
    function saveHalls(list){ localStorage.setItem("tepliceD_halls", JSON.stringify(list)); }
    function loadDrivers(){ try { return JSON.parse(localStorage.getItem("tepliceD_drivers")||"{}"); } catch(e){ return {}; } }
    function saveDrivers(m){ localStorage.setItem("tepliceD_drivers", JSON.stringify(m)); }
    function loadMoney(){ try { return JSON.parse(localStorage.getItem("tepliceD_money")||"{}"); } catch(e){ return {}; } }
    function saveMoney(m){ localStorage.setItem("tepliceD_money", JSON.stringify(m)); }
    let halls = loadHalls();
    let tripDrivers = loadDrivers();
    let tripMoneyMap = loadMoney();
    function moneyKey(){ return tripFrom+"|"+tripTo; }
    function hallOf(m){
      const blob = ((m.kuzelna||"")+" "+(m.souper||"")).toLowerCase();
      return halls.find(h => (h.keys||[]).some(k => blob.includes(k)) || blob.includes((h.name||"").toLowerCase())) || null;
    }
    function toInputDate(dmy){
      const p=String(dmy||"").split(".");
      if(p.length<3) return "";
      return `${p[2].padStart(4,"0")}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
    }
    function fromInputDate(iso){
      const p=String(iso||"").split("-");
      if(p.length<3) return "";
      return Number(p[2])+"."+Number(p[1])+"."+p[0];
    }

    function played(m){ return String(m.odehrano).toLowerCase() === "ano" && m.vysledek; }
    function resultClass(m){
      const a = Number(m.body_td), b = Number(m.body_opp);
      if (!played(m) || Number.isNaN(a) || Number.isNaN(b)) return "plan";
      if (a > b) return "win";
      if (a < b) return "loss";
      return "draw";
    }
    function resultLabel(m){
      const c = resultClass(m);
      return c === "win" ? "výhra" : c === "loss" ? "prohra" : c === "draw" ? "remíza" : "naplánováno";
    }
    function parseDate(d){
      const p = String(d||"").split(".");
      if (p.length < 3) return 0;
      return Date.UTC(p[2], Number(p[1])-1, Number(p[0]));
    }
    const seasons = [...new Set(DATA.matches.map(m => m.rocnik))].sort().reverse();
    const allMatches = [...DATA.matches].sort((a,b) => {
      const da = parseDate(a.datum) - parseDate(b.datum);
      return da || Number(a.kolo) - Number(b.kolo);
    });

    function kpis(){
      const playedMs = allMatches.filter(played);
      const w = playedMs.filter(m => resultClass(m)==="win").length;
      const d = playedMs.filter(m => resultClass(m)==="draw").length;
      const l = playedMs.filter(m => resultClass(m)==="loss").length;
      $("#kpi").innerHTML = `
        <div class="stat"><b>${DATA.meta.rocniky}</b><span>ročníky</span></div>
        <div class="stat"><b>${playedMs.length}</b><span>odehraných zápasů</span></div>
        <div class="stat"><b>${w}–${d}–${l}</b><span>výhry – remízy – prohry</span></div>
        <div class="stat"><b>${DATA.stats.length}</b><span>hráčů v databázi</span></div>`;
    }

    function seasonMatches(){
      return season === "all" ? allMatches : allMatches.filter(m => m.rocnik === season);
    }
    function pinAvg(list, where){
      const pins = list.filter(played)
        .filter(m => !where || m.misto === where)
        .map(m => Number(m.kuzelky_td)).filter(n => n > 0);
      return pins.length ? Math.round(pins.reduce((a,b)=>a+b,0)/pins.length) : "—";
    }
    function balanceHtml(list){
      const p = list.filter(played);
      const w = p.filter(m => resultClass(m)==="win").length;
      const d = p.filter(m => resultClass(m)==="draw").length;
      const l = p.filter(m => resultClass(m)==="loss").length;
      const label = season === "all" ? "Všechny ročníky" : season;
      return `<div class="balance">
        <div class="title">${label}</div>
        <div class="num">${w}–${d}–${l}</div>
        <span class="chip">průměr doma ${pinAvg(list,"doma")}</span>
        <span class="chip">průměr venku ${pinAvg(list,"venku")}</span>
      </div>`;
    }

    const PLACEMENT = Object.assign({
      "2026/2027": "7. místo",
      "2025/2026": "10. místo",
      "2024/2025": "9. místo",
      "2023/2024": "11. místo",
      "2022/2023": "9. místo",
      "2021/2022": "11. místo",
      "2020/2021": "11. místo",
      "2019/2020": "11. místo",
      "2018/2019": "13. místo",
      "2017/2018": "12. místo"
    }, (DATA.meta && DATA.meta.umisteni) || {});
    function seasonRecord(year){
      const list = allMatches.filter(m => m.rocnik === year);
      const p = list.filter(played);
      return {
        list,
        w: p.filter(m => resultClass(m)==="win").length,
        d: p.filter(m => resultClass(m)==="draw").length,
        l: p.filter(m => resultClass(m)==="loss").length,
        place: PLACEMENT[year] || "umístění neuvedeno"
      };
    }
    function renderSeasonCards(){
      return `<div class="season-grid">
        ${seasons.map(s => {
          const r = seasonRecord(s);
          return `<button class="season-card" data-season="${s}">
            <div class="yr">${s}</div>
            <div class="ratio">${r.w}–${r.d}–${r.l}</div>
            <div class="place">${r.place}</div>
          </button>`;
        }).join("")}
      </div>`;
    }
    function renderMatches(){
      if (!openedSeason) return renderSeasonCards();
      season = openedSeason;
      const list = seasonMatches();
      const selected = DATA.matches.find(m => String(m.id) === String(selectedId));
      const detPlayers = DATA.players.filter(p => String(p.id_zapasu) === String(selected?.id));
      return `
        <div class="filters">
          <button class="back-btn" id="backSeasons">← Ročníky</button>
        </div>
        ${balanceHtml(list)}
        <div style="overflow:auto">
          <table class="grid">
            <thead>
              <tr>
                <th>Kolo</th><th>Datum</th><th>Čas</th><th>Místo</th>
                <th>Soupeř</th><th>Výsledek</th><th class="hide-sm">Kuželky</th><th>Stav</th>
              </tr>
            </thead>
            <tbody>
              ${list.map(m => `
                <tr data-id="${m.id}" class="${m.id==selectedId?"selected":""} ${played(m)?"":"planned"}">
                  <td>${m.kolo}</td>
                  <td>${m.datum}</td>
                  <td>${m.cas || ""}</td>
                  <td><span class="pill ${m.misto==="doma"?"home":"away"}">${m.misto || "—"}</span></td>
                  <td><span class="player-link" data-oppteam="${encodeURIComponent(m.souper||"")}">${m.souper}</span></td>
                  <td>${m.vysledek || "– : –"}</td>
                  <td class="hide-sm">${m.kuzelky_td ?? "—"} : ${m.kuzelky_opp ?? "—"}</td>
                  <td><span class="pill ${resultClass(m)}">${resultLabel(m)}</span></td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        ${selected ? `
          <div class="modal-bg" id="matchModal">
            <div class="modal">
              <div class="card-head">
                <h2>${selected.tym} vs ${selected.souper}</h2>
                <button class="back-btn" id="closeMatch">Zavřít</button>
              </div>
              <div class="muted">${selected.rocnik} · ${selected.kolo}. kolo · ${selected.datum} ${selected.cas || ""}</div>
              <p><span class="pill ${selected.misto==="doma"?"home":"away"}" style="font-size:15px;padding:6px 12px">${selected.misto==="doma"?"DOMA":selected.misto==="venku"?"VENKU":(selected.misto||"—")}</span>
              · Kuželna ${selected.kuzelna || "—"}</p>
              <div class="scoreline">${selected.vysledek || "zápas ještě nemá zápis"}</div>
              <p>Kuželky <b>${selected.kuzelky_td ?? "—"} : ${selected.kuzelky_opp ?? "—"}</b>
              · Plné ${selected.plne_td ?? "—"} / ${selected.plne_opp ?? "—"}
              · Dorážka ${selected.dor_td ?? "—"} / ${selected.dor_opp ?? "—"}
              · Chyby ${selected.chyby_td ?? "—"} / ${selected.chyby_opp ?? "—"}</p>
              <p class="muted">Kuželna: ${selected.kuzelna || "—"} · Rozhodčí: ${selected.rozhodci || "—"}</p>
              ${detPlayers.map(p => {
                const laneHead = `<tr><th>Dráha</th><th>P</th><th>D</th><th>Ch</th><th>Σ</th><th>SB</th></tr>`;
                const laneRows = (arr) => (arr||[]).map(dr => `<tr><td>${dr.draha}</td><td>${dr.plne}</td><td>${dr.dorazka}</td><td>${dr.chyby}</td><td>${dr.soucet}</td><td><b>${dr.sb ?? "—"}</b></td></tr>`).join("") || `<tr><td colspan="6" class="muted">Bez rozpisu drah</td></tr>`;
                const tot = (arr, key) => (arr||[]).reduce((a,x)=>a+Number(x[key]||0),0);
                return `<div class="pair">
                  <div class="pair-grid">
                    <div>
                      <h3>${p.hrac} <span class="pill ${p.vysledek==="výhra"?"win":p.vysledek==="prohra"?"loss":"draw"}">${p.vysledek || "—"}</span></h3>
                      <div class="scoreline" style="font-size:26px">${p.soucet ?? "—"}</div>

                      <div class="scoreline" style="font-size:26px">${p.souper_soucet ?? "—"}</div>
                      <div class="muted">P ${p.souper_plne ?? "—"} · D ${p.souper_dorazka ?? "—"} · Ch ${p.souper_chyby ?? "—"} · SB ${p.souper_sb ?? tot(p.souper_drahy,"sb")}</div>

    }

    function renderPlayers(){
      const list = (season==="all"?DATA.players:DATA.players.filter(p=>p.rocnik===season))
        .filter(p => {
          const s = q.trim().toLowerCase();
          if (!s) return true;
          return [p.hrac, p.souper, p.souper_hrac, p.kuzelna].join(" ").toLowerCase().includes(s);
        }).slice().reverse();
      return `<div class="filters">
          <select id="season">
            <option value="all">Všechny ročníky</option>
            ${seasons.map(s => `<option value="${s}" ${s===season?"selected":""}>${s}</option>`).join("")}
          </select>
          <input id="q" type="search" placeholder="Hledat hráče, soupeře…" value="${q.replaceAll('"','&quot;')}" />
          <span class="muted">${list.length} výkonů</span>
        </div>
        <div style="overflow:auto;max-height:72vh">
          <table class="grid">
            <thead><tr><th>Datum</th><th>Hráč</th><th>Součet</th><th>Plné</th><th>Dorážka</th><th>Chyby</th><th>Soupeř</th><th>Výsledek</th><th class="hide-sm">Kuželna</th></tr></thead>
            <tbody>${list.slice(0,500).map(p => `<tr>
              <td>${p.datum}<div class="muted">${p.rocnik} · ${p.kolo}. kolo</div></td>
              <td>${p.hrac}</td><td><b>${p.soucet ?? "—"}</b></td>
              <td>${p.plne ?? "—"}</td><td>${p.dorazka ?? "—"}</td><td>${p.chyby ?? "—"}</td>
              <td>${p.souper_hrac}<div class="muted">${p.souper} · ${p.souper_soucet ?? "—"}</div></td>
              <td><span class="pill ${p.vysledek==="výhra"?"win":p.vysledek==="prohra"?"loss":"draw"}">${p.vysledek || "—"}</span></td>
              <td class="hide-sm">${p.kuzelna}</td>
            </tr>`).join("")}</tbody>
          </table>
        </div>`;
    }

    function playerKey(p){ return String(p.id_hrace || p.id || p.hrac); }
    function performancesOf(player){
      const id = player.id || player.id_hrace;
      return DATA.players.filter(x => (id && String(x.id_hrace) === String(id)) || x.hrac === player.hrac);
    }
    function summarize(list){
      const nums = list.map(x => Number(x.soucet)).filter(n => !Number.isNaN(n));
      const w = list.filter(x => x.vysledek === "výhra").length;
      const l = list.filter(x => x.vysledek === "prohra").length;
      const d = list.filter(x => x.vysledek === "remíza").length;
      const avg = nums.length ? (nums.reduce((a,b)=>a+b,0)/nums.length) : 0;
      const max = nums.length ? Math.max(...nums) : null;
      const min = nums.length ? Math.min(...nums) : null;
      const plne = list.map(x => Number(x.plne)).filter(n => !Number.isNaN(n));
      const dor = list.map(x => Number(x.dorazka)).filter(n => !Number.isNaN(n));
      const chy = list.map(x => Number(x.chyby)).filter(n => !Number.isNaN(n));
      return {
        starty: list.length, avg, max, min, w, l, d,
        plne: plne.reduce((a,b)=>a+b,0),
        dor: dor.reduce((a,b)=>a+b,0),
        chy: chy.reduce((a,b)=>a+b,0)
      };
    }
    function barColor(p){
      if (p.vysledek === "výhra") return "#1f6d42";
      if (p.vysledek === "prohra") return "#a83232";
      if (p.vysledek === "remíza") return "#c9a45a";
      return "#215d86";
    }
    function renderPlayerChart(list){
      const rows = list.filter(p => p.soucet != null && p.soucet !== "").slice().reverse();
      if (!rows.length) return `<div class="chart-box muted">Pro zvolený filtr nejsou číselné výkony k vykreslení.</div>`;
      const w = Math.max(560, rows.length * 28);
      const h = 260, padL = 36, padB = 58, padT = 24, padR = 12;
      const vals = rows.map(p => Number(p.soucet) || 0);
      const minPerf = Math.min(...vals);
      const maxPerf = Math.max(...vals);
      const minV = minPerf - 10;
      const maxV = maxPerf + 10;
      const span = Math.max(1, maxV - minV);
      const innerW = w - padL - padR;
      const innerH = h - padT - padB;
      const gap = rows.length > 20 ? 2 : 4;
      const barW = Math.max(8, innerW / rows.length - gap);
      const yFor = v => padT + innerH - ((v - minV) / span) * innerH;
      const ticks = [minV, Math.round(minV + span * 0.25), Math.round(minV + span * 0.5), Math.round(minV + span * 0.75), maxV];
      const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
      const bars = rows.map((p,i) => {
        const x = padL + i * (barW + gap);
        const y = yFor(Number(p.soucet)||0);
        const bh = padT + innerH - y;
        const title = `${p.datum} · ${p.rocnik} · ${p.kolo}. kolo · ${p.soucet} · ${p.kuzelna||""}`;
        const label = `${p.kolo}`;
        return `<g>
          <rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="3" fill="${barColor(p)}">
            <title>${title}</title>
          </rect>
          <text x="${x + barW/2}" y="${h-36}" text-anchor="middle" font-size="9" fill="#4e5b6a" transform="rotate(-55 ${x + barW/2} ${h-36})">${p.datum}</text>
        </g>`;
      }).join("");
      return `<div class="chart-box">
        <svg viewBox="0 0 ${w} ${h}" width="100%" height="280" role="img" aria-label="Sloupcový graf výkonů">
          ${ticks.map(t => `<g>
            <line x1="${padL}" x2="${w-padR}" y1="${yFor(t)}" y2="${yFor(t)}" stroke="#eadfcf"/>
            <text x="${padL-6}" y="${yFor(t)+4}" text-anchor="end" font-size="10" fill="#4e5b6a">${t}</text>
          </g>`).join("")}
          <line x1="${padL}" x2="${w-padR}" y1="${yFor(avg)}" y2="${yFor(avg)}" stroke="#10263d" stroke-dasharray="4 4"/>
          ${bars}
        </svg>
        <div class="chart-legend">
          <span>sloupce = součet kuželek</span>
          <span style="color:#1f6d42">■ výhra</span>
          <span style="color:#a83232">■ prohra</span>
          <span style="color:#c9a45a">■ remíza</span>
          <span>tečkovaná čára = průměr ${Math.round(avg)}</span>
          <span>rozsah ${minV}–${maxV} (nejhorší −10 / nejlepší +10)</span>
        </div>
      </div>`;
    }
    function renderPlayerCard(){
      const all = performancesOf(selectedPlayer).slice().sort((a,b) => parseDate(b.datum)-parseDate(a.datum));
      const seasonsP = [...new Set(all.map(x => x.rocnik).filter(Boolean))].sort().reverse();
      const venuesP = [...new Set(all.map(x => x.kuzelna).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"cs"));
      let list = all.filter(x =>
        (playerSeason === "all" || x.rocnik === playerSeason) &&
        (playerVenue === "all" || x.kuzelna === playerVenue) &&

      );
      if (playerSpan === "5") list = list.slice(0,5);
      if (playerSpan === "10") list = list.slice(0,10);
      const s = summarize(list);
      const total = summarize(all);
      return `
        <div class="card-head">
          <div>
            <button class="back-btn" id="backPlayers">← Zpět na statistiku</button>
            <h2 style="font-family:Fraunces,serif;margin:10px 0 4px">${selectedPlayer.hrac}</h2>
            <div class="muted">ID ${selectedPlayer.id || selectedPlayer.id_hrace || "—"} · celkem ${total.starty} startů · průměr ${Math.round(total.avg)}</div>
          </div>
        </div>
        <div class="filters">
          <select id="playerSeason">
            <option value="all">Všechny ročníky</option>
            ${seasonsP.map(v => `<option value="${v}" ${v===playerSeason?"selected":""}>${v}</option>`).join("")}
          </select>
          <select id="playerVenue">
            <option value="all">Všechny kuželny</option>
            ${venuesP.map(v => `<option value="${v.replaceAll('"','&quot;')}" ${v===playerVenue?"selected":""}>${v}</option>`).join("")}
          </select>
          <select id="playerPlace">
            <option value="all" ${playerPlace==="all"?"selected":""}>Doma / venku</option>
            <option value="doma" ${playerPlace==="doma"?"selected":""}>Doma</option>
            <option value="venku" ${playerPlace==="venku"?"selected":""}>Venku</option>
          </select>
          <select id="playerSpan">
            <option value="all" ${playerSpan==="all"?"selected":""}>Všechny zápasy</option>
            <option value="5" ${playerSpan==="5"?"selected":""}>Posledních 5 zápasů</option>
            <option value="10" ${playerSpan==="10"?"selected":""}>Posledních 10 zápasů</option>
          </select>
          <button class="chart-btn ${showChart?"active":""}" id="toggleChart">${showChart ? "Skrýt graf" : "Graf"}</button>
        </div>
        ${showChart ? renderPlayerChart(list) : ""}
        <div class="balance">
          <div class="title">${playerSeason==="all"?"Všechny ročníky":playerSeason}${playerVenue==="all"?"":" · "+playerVenue}</div>
          <div class="num">${s.starty}</div>
          <span class="chip">startů</span>
          <span class="chip">průměr ${s.starty ? Math.round(s.avg) : "—"}</span>
          <span class="chip">max ${s.max ?? "—"}</span>
          <span class="chip">min ${s.min ?? "—"}</span>
          <span class="chip">V–P–R ${s.w}–${s.l}–${s.d}</span>
        </div>
        <div style="overflow:auto">
          <table class="grid">
            <thead>
              <tr>
                <th>Datum</th><th>Ročník</th><th>Kolo</th><th>Kuželna</th>
                <th>Soupeř</th><th>Součet</th><th>Plné</th><th>Dorážka</th><th>Chyby</th><th>Výsledek</th>
              </tr>
            </thead>
            <tbody>
              ${list.map(p => `<tr>
                <td>${p.datum}</td>
                <td>${p.rocnik}</td>
                <td>${p.kolo}</td>
                <td>${p.kuzelna || "—"}</td>
                <td>${p.souper_hrac || "—"}<div class="muted">${p.souper || ""}</div></td>
                <td><b>${p.soucet ?? "—"}</b></td>
                <td>${p.plne ?? "—"}</td>
                <td>${p.dorazka ?? "—"}</td>
                <td>${p.chyby ?? "—"}</td>
                <td><span class="pill ${p.vysledek==="výhra"?"win":p.vysledek==="prohra"?"loss":"draw"}">${p.vysledek || "—"}</span></td>
              </tr>`).join("") || `<tr><td colspan="10" class="muted">Pro zvolený filtr nejsou žádné výkony.</td></tr>`}
            </tbody>
          </table>
        </div>`;
    }
    function renderStats(){
      if (selectedPlayer) return renderPlayerCard();
      const list = DATA.stats.slice().sort((a,b)=>(Number(b.starty)||0)-(Number(a.starty)||0) || String(a.hrac).localeCompare(String(b.hrac),"cs"));
      return `<div style="overflow:auto">
        <table class="grid">
          <thead><tr><th>#</th><th>Hráč</th><th>Starty</th><th>Průměr</th><th>Plné</th><th>Dorážka</th><th>Chyby</th><th>Max</th><th>V / P</th></tr></thead>
          <tbody>${list.map((p,i)=>{
            const n=Number(p.starty)||0;
            const a=v=> n && v!=null ? Math.round(Number(v)/n) : "—";
            return `<tr class="player-row" data-player="${encodeURIComponent(p.hrac)}" data-pid="${p.id ?? ""}">
            <td>${i+1}</td>
            <td class="player-link">${p.hrac}</td>
            <td>${p.starty}</td>
            <td><b>${Math.round(Number(p.prumer||0))}</b></td>
            <td>${a(p.plne)}</td>
            <td>${a(p.dorazka)}</td>
            <td>${a(p.chyby)}</td>
            <td>${p.max ?? "—"}</td>
            <td>${p.vyhry ?? 0} / ${p.prohry ?? 0}</td>
          </tr>`;}).join("")}</tbody>
        </table>
      </div>`;
    }

    function parseDate(s){
      const m = String(s||"").match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
      if (!m) return 0;
      return Date.UTC(+m[3], +m[2]-1, +m[1]);
    }
    function oppRows(){
      if (DATA.opp && DATA.opp.length) return DATA.opp;
      return DATA.players.filter(p => p.souper && p.souper_hrac).map(p => ({
        rocnik: p.rocnik, kolo: p.kolo, datum: p.datum, id_zapasu: p.id_zapasu,
        tym: p.souper, souper: p.tym || "TJ Teplice Letná D", hrac: p.souper_hrac,
        soucet: p.souper_soucet, plne: p.souper_plne, dorazka: p.souper_dorazka,
        chyby: p.souper_chyby, sb: p.souper_sb, misto: p.misto==="doma"?"venku":"doma",
        kuzelna: p.kuzelna
      }));
    }
    function homeVenues(){
      const map = {};
      (DATA.matches||[]).forEach(m => {
        if (m.misto==="venku" && m.souper && m.kuzelna) map[m.souper] = m.kuzelna;
        if (m.misto==="doma" && m.kuzelna) map["TJ Teplice Letná D"] = m.kuzelna;
      });
      (DATA.players||[]).forEach(p => {
        if (p.misto==="venku" && p.souper && p.kuzelna) map[p.souper] = p.kuzelna;
      });
      map["SK Verneřice B"] = map["SK Verneřice B"] || "SK Verneřice";
      return map;
    }
    function venueOf(r){
      if (r.kuzelna) return r.kuzelna;
      const hv = homeVenues();
      if (r.misto==="doma") return hv[r.tym] || r.tym || "—";
      return hv[r.souper] || r.souper || "—";
    }
    function last10Avg(rows){
      const vals = rows.slice().sort((a,b)=>parseDate(b.datum)-parseDate(a.datum))
        .map(r => Number(r.soucet)).filter(n => n>0).slice(0,10);
      if (!vals.length) return null;
      return vals.reduce((a,b)=>a+b,0)/vals.length;
    }
    function renderOpponents(){
      const rows = oppRows();
      const s = oppQ.trim().toLowerCase();
      const vsTeplice = new Set(DATA.players.map(p => p.souper).filter(Boolean));
      const teams = [...new Set(rows.map(r => r.tym).filter(t => t && !/Teplice Letná D/.test(t) && (vsTeplice.has(t) || [...vsTeplice].some(v => v && t.includes(v.split(" ")[0])))))].sort((a,b)=>a.localeCompare(b,"cs"));
      const teamList = teams.length ? teams : [...new Set(rows.map(r => r.tym).filter(t => t && !/Teplice Letná D/.test(t)))].sort((a,b)=>a.localeCompare(b,"cs"));
      if (!oppTeam){
        const shown = teamList.filter(t => {
          if (!s) return true;
          if (t.toLowerCase().includes(s)) return true;
          return rows.some(r => r.tym===t && String(r.hrac).toLowerCase().includes(s));
        });
        return `<div class="season-grid">${shown.map(t => {
            const rs = rows.filter(r => r.tym===t);
            const nP = new Set(rs.map(r => r.hrac)).size;
            return `<button class="season-card" data-oppteam="${encodeURIComponent(t)}">
              <div class="yr" style="font-size:18px">${t}</div>
              <div class="place">${nP} hráčů · ${rs.length} výkonů</div>
            </button>`;
          }).join("")}</div>`;
      }
      const teamRows = rows.filter(r => r.tym===oppTeam);
      if (!oppPlayer){
        const names = [...new Set(teamRows.map(r => r.hrac))].sort((a,b)=>a.localeCompare(b,"cs"))
          .filter(n => !s || n.toLowerCase().includes(s) || oppTeam.toLowerCase().includes(s));
        return `<div class="filters">
            <button class="back-btn" id="backOppTeams">← Týmy</button>
          </div>
          <div class="balance"><div class="title">${oppTeam}</div></div>
          <div style="overflow:auto"><table class="grid">
            <thead><tr><th>Hráč</th><th>Starty</th><th>Průměr posledních 10</th><th>Max</th></tr></thead>
            <tbody>${names.map(n => {
              const rs = teamRows.filter(r => r.hrac===n);
              const avg = last10Avg(rs);
              const mx = Math.max(0, ...rs.map(r => Number(r.soucet)||0));
              return `<tr class="player-row" data-oppplayer="${encodeURIComponent(n)}" data-oppteam="${encodeURIComponent(oppTeam)}">
                <td class="player-link">${n}</td><td>${rs.length}</td>
                <td><b>${avg?Math.round(avg):"—"}</b></td><td>${mx||"—"}</td></tr>`;
            }).join("")}</tbody>
          </table></div>`;
      }
      const allList = teamRows.filter(r => r.hrac===oppPlayer)
        .slice().sort((a,b)=>parseDate(b.datum)-parseDate(a.datum));
      const venues = [...new Set(allList.map(venueOf).filter(v => v && v!=="—"))].sort((a,b)=>a.localeCompare(b,"cs"));
      let list = allList.filter(r =>
        (oppVenue==="all" || venueOf(r)===oppVenue) &&
        (oppPlace==="all" || r.misto===oppPlace)
      );
      if (oppSpan==="5") list = list.slice(0,5);
      if (oppSpan==="10") list = list.slice(0,10);
      const avgVals = list.map(r => Number(r.soucet)).filter(n => n>0);
      const avgAll = avgVals.length ? Math.round(avgVals.reduce((a,b)=>a+b,0)/avgVals.length) : "—";
      return `<div class="filters">
          <button class="back-btn" id="backOppPlayers">← ${oppTeam}</button>
          <select id="oppVenue">
            <option value="all">Kuželny</option>
            ${venues.map(v => `<option value="${v.replaceAll('"','&quot;')}" ${v===oppVenue?"selected":""}>${v}</option>`).join("")}
          </select>
          <select id="oppPlace">
            <option value="all" ${oppPlace==="all"?"selected":""}>Doma / venku</option>
            <option value="doma" ${oppPlace==="doma"?"selected":""}>Doma</option>
            <option value="venku" ${oppPlace==="venku"?"selected":""}>Venku</option>
          </select>
          <select id="oppSpan">
            <option value="all" ${oppSpan==="all"?"selected":""}>Všechny zápasy</option>
            <option value="5" ${oppSpan==="5"?"selected":""}>Posledních 5 zápasů</option>
            <option value="10" ${oppSpan==="10"?"selected":""}>Posledních 10 zápasů</option>
          </select>
        </div>
        <div class="balance"><div class="title">${oppPlayer}</div><div class="num">${avgAll}</div><span class="chip">průměr dle filtru</span><span class="chip">${list.length} zápasů</span></div>
        <div style="overflow:auto"><table class="grid">
          <thead><tr><th>Datum</th><th>Kuželna</th><th>Výkon</th><th>Plné</th><th>Dorážka</th><th>Chyby</th></tr></thead>
          <tbody>${list.map(r => `<tr>
            <td>${r.datum}<div class="muted">${r.rocnik} · ${r.kolo}. kolo</div></td>
            <td>${venueOf(r)}</td>
            <td><b>${r.soucet ?? "—"}</b></td>
            <td>${r.plne ?? "—"}</td><td>${r.dorazka ?? "—"}</td><td>${r.chyby ?? "—"}</td>
          </tr>`).join("")}</tbody>
        </table></div>`;
    }


    function renderHalls(){
      return `<div class="balance"><div class="title">Databáze kuželen</div><span class="chip">${halls.length} kuželen</span></div>
        <div class="hall-form">
          <input id="newHallName" placeholder="Název kuželny" />

          <button class="add-btn" id="addHall">Přidej kuželnu</button>

        </div>
        <div style="overflow:auto"><table class="grid">
          <thead><tr><th>Kuželna</th><th>Vzdálenost</th></tr></thead>
          <tbody>${halls.slice().sort((a,b)=>a.name.localeCompare(b.name,"cs")).map(h =>
            `<tr><td>${h.name}</td><td><b>${h.km}</b> km</td></tr>`).join("")}</tbody>
        </table></div>`;
    }
    function awayInRange(){
      const a=parseDate(tripFrom), b=parseDate(tripTo);
      return allMatches.filter(m => {
        if (m.misto!=="venku") return false;
        const hall=(m.kuzelna||"")+" "+(m.souper||"");
        if (/Teplice Letná/i.test(hall)) return false;
        const d=parseDate(m.datum);
        return d>=a && d<=b;
      }).sort((x,y)=>parseDate(x.datum)-parseDate(y.datum));
    }
    function renderTrips(){
      const list=awayInRange();
      const sums={}; DRIVERS.forEach(n=>sums[n]=0);
      list.forEach(m=>{
        const who=tripDrivers[m.id];
        const h=hallOf(m);
        if(who && h) sums[who]+=2*(Number(h.km)||0);
      });
      const totalKm=Object.values(sums).reduce((a,b)=>a+b,0);
      const budget=Number(tripMoneyMap[moneyKey()]||0);
      return `<div class="filters">
          <label>Datum od <input type="date" id="tripFrom" value="${toInputDate(tripFrom)}" /></label>
          <label>Datum do <input type="date" id="tripTo" value="${toInputDate(tripTo)}" /></label>
        </div>
        <div style="overflow:auto;margin-bottom:16px"><table class="grid">
          <thead><tr><th>Datum</th><th>Kuželna</th><th>Soupeř</th><th>Km</th><th>Kdo jel</th></tr></thead>
          <tbody>${list.map(m=>{
            const h=hallOf(m);
            const who=tripDrivers[m.id]||"";
            return `<tr>
              <td>${m.datum}<div class="muted">${m.rocnik} · ${m.kolo}. kolo</div></td>
              <td>${h?h.name:(m.kuzelna||"—")}</td>
              <td>${m.souper||""}</td>
              <td><b>${h?h.km:"?"}</b>${h?" km":""}</td>
              <td><select data-tripid="${m.id}">
                <option value="">—</option>
                ${DRIVERS.map(n=>`<option value="${n}" ${n===who?"selected":""}>${n}</option>`).join("")}
              </select></td>
            </tr>`;
          }).join("") || `<tr><td colspan="5" class="muted">Ve zvoleném období není žádný venkovní zápas.</td></tr>`}</tbody>
        </table></div>
        <div class="split-grid">
          <div>
            <div class="balance"><div class="title">Najeté km</div><span class="chip">Celkem cesta tam a zpět dle mapy.com</span></div>
            <table class="grid">
              <thead><tr><th>Řidič</th><th>Km</th></tr></thead>
              <tbody>${DRIVERS.map(n=>`<tr><td>${n}</td><td><b>${sums[n]}</b></td></tr>`).join("")}
              <tr><td><b>Celkem</b></td><td><b>${totalKm}</b></td></tr></tbody>
            </table>
          </div>
          <div>
            <div class="balance"><div class="title">Peníze na cesty</div></div>
            <div class="trip-money">
              <input id="tripBudget" type="number" min="0" step="1" value="${budget||""}" placeholder="Kč celkem" />
              <span class="muted">Kč ve zvoleném období</span>
            </div>
            <table class="grid">
              <thead><tr><th>Řidič</th><th>Podíl</th></tr></thead>
              <tbody>${DRIVERS.map(n=>{
                const share = totalKm && budget ? Math.round(budget * sums[n] / totalKm) : 0;
                return `<tr><td>${n}</td><td><b>${share}</b> Kč</td></tr>`;
              }).join("")}
              <tr><td><b>Rozděleno</b></td><td><b>${totalKm && budget ? DRIVERS.reduce((a,n)=>a+Math.round(budget*sums[n]/totalKm),0) : 0}</b> Kč</td></tr>
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function render(){
      kpis();
      const root = $("#app");
      root.innerHTML = tab==="matches" ? renderMatches() : tab==="opponents" ? renderOpponents() : tab==="halls" ? renderHalls() : tab==="trips" ? renderTrips() : renderStats();
      const sel = $("#season"); if (sel) sel.onchange = e => { season = e.target.value; selectedId = null; render(); };
      const inp = $("#q"); if (inp) inp.oninput = e => { q = e.target.value; render(); };
      root.querySelectorAll("tbody tr[data-id]").forEach(tr => {
        tr.onclick = () => { selectedId = tr.dataset.id; render(); };
      });
      const closeMatch = $("#closeMatch");
      if (closeMatch) closeMatch.onclick = (e) => { e.stopPropagation(); selectedId = null; render(); };
      const matchModal = $("#matchModal");
      if (matchModal) matchModal.onclick = (e) => { if (e.target.id === "matchModal") { selectedId = null; render(); } };
      root.querySelectorAll(".season-card").forEach(btn => {
        btn.onclick = () => { openedSeason = btn.dataset.season; selectedId = null; render(); };
      });
      const backSeasons = $("#backSeasons");
      if (backSeasons) backSeasons.onclick = () => { openedSeason = null; selectedId = null; render(); };
      const oppInp = $("#oppQ");
      if (oppInp) oppInp.oninput = e => { oppQ = e.target.value; render(); };
      root.querySelectorAll("[data-oppteam]").forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const t = decodeURIComponent(btn.dataset.oppteam);
          if (!t) return;
          tab = "opponents";
          document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab==="opponents"));
          oppTeam = t; oppPlayer = null; oppQ = ""; selectedId = null; render();
        };
      });
      root.querySelectorAll("[data-oppplayer]").forEach(el => {
        el.onclick = (e) => {
          e.stopPropagation();
          const n = decodeURIComponent(el.dataset.oppplayer);
          if (el.dataset.oppteam) oppTeam = decodeURIComponent(el.dataset.oppteam);
          oppPlayer = n; oppVenue="all"; oppPlace="all"; oppSpan="all"; tab = "opponents";
          document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab==="opponents"));
          selectedId = null; render();
        };
      });
      const backOppTeams = $("#backOppTeams");
      if (backOppTeams) backOppTeams.onclick = () => { oppTeam = null; oppPlayer = null; render(); };
      const backOppPlayers = $("#backOppPlayers");
      if (backOppPlayers) backOppPlayers.onclick = () => { oppPlayer = null; oppVenue="all"; oppPlace="all"; oppSpan="all"; render(); };
      const ov = $("#oppVenue"); if (ov) ov.onchange = e => { oppVenue = e.target.value; render(); };
      const op = $("#oppPlace"); if (op) op.onchange = e => { oppPlace = e.target.value; render(); };
      const os = $("#oppSpan"); if (os) os.onchange = e => { oppSpan = e.target.value; render(); };
      function openPlayer(el){
        const name = decodeURIComponent(el.dataset.player);
        const pid = el.dataset.pid;
        selectedPlayer = DATA.stats.find(p => String(p.id) === String(pid) && pid) || DATA.stats.find(p => p.hrac === name) || {hrac:name, id:pid};
        playerSeason = "all";
        playerVenue = "all";
        playerPlace = "all";
        playerSpan = "all";
        showChart = false;
        render();
      }
      root.querySelectorAll(".player-row").forEach(tr => {
        if (tr.dataset.oppplayer) return;
        tr.onclick = () => openPlayer(tr);
      });
      root.querySelectorAll(".player-link[data-player]").forEach(btn => {
        btn.onclick = (e) => { e.stopPropagation(); openPlayer(btn); };
      });
      const back = $("#backPlayers");
      if (back) back.onclick = () => { selectedPlayer = null; render(); };
      const ps = $("#playerSeason");
      if (ps) ps.onchange = e => { playerSeason = e.target.value; render(); };
      const pv = $("#playerVenue");
      if (pv) pv.onchange = e => { playerVenue = e.target.value; render(); };
      const pp = $("#playerPlace");
      if (pp) pp.onchange = e => { playerPlace = e.target.value; render(); };
      const psp = $("#playerSpan");
      if (psp) psp.onchange = e => { playerSpan = e.target.value; render(); };
      const cg = $("#toggleChart");
      if (cg) cg.onclick = () => { showChart = !showChart; render(); };
      const addHall = $("#addHall");
      if (addHall) addHall.onclick = () => {
        const name = ($("#newHallName").value||"").trim();
        const km = Number($("#newHallKm").value);
        if (!name || !(km>=0)) return;
        halls.push({name, km, keys:[name.toLowerCase()]});
        saveHalls(halls);
        render();
      };
      const tf = $("#tripFrom"); if (tf) tf.onchange = e => { tripFrom = fromInputDate(e.target.value); render(); };
      const tt = $("#tripTo"); if (tt) tt.onchange = e => { tripTo = fromInputDate(e.target.value); render(); };
      root.querySelectorAll("select[data-tripid]").forEach(sel => {
        sel.onchange = e => {
          tripDrivers[sel.dataset.tripid] = e.target.value;
          saveDrivers(tripDrivers);
          render();
        };
      });
      const tb = $("#tripBudget");
      if (tb) tb.onchange = e => {
        tripMoneyMap[moneyKey()] = Number(e.target.value)||0;
        saveMoney(tripMoneyMap);
        render();
      };
    }
    document.querySelectorAll("nav.tabs button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        tab = btn.dataset.tab;
        render();
      };
    });
    render();
    function showLastUpdate(){
      const el = $("#updateTime");
      if (!el) return;
      const ts = localStorage.getItem("tepliceD_lastUpdate");
      el.textContent = ts ? ("Poslední aktualizace: " + ts) : "Zatím neaktualizováno";
    }
    function applySavedResults(){
      try {
        const patch = JSON.parse(localStorage.getItem("tepliceD_resultPatch")||"null");
        if (!patch) return;
        (patch.matches||[]).forEach(p => {
          const m = DATA.matches.find(x => x.rocnik==="2026/2027" && Number(x.kolo)===Number(p.kolo));
          if (!m) return;
          Object.assign(m, p);
        });
        if (patch.place) {
          DATA.meta = DATA.meta || {};
          DATA.meta.umisteni = Object.assign({}, DATA.meta.umisteni, {"2026/2027": patch.place});
          Object.assign(PLACEMENT, DATA.meta.umisteni);
        }
      } catch(e){}
    }
    function normTeam(s){
      return String(s||"").replace(/\s+/g," ").replace(/Sokol Ústí nad Labem/g,"Sokol Ústí n. L.").replace(/Sokol Roudnice n\. L\./g,"Sokol Roudnice nad Labem").trim();
    }
    async function fetchHtml(url){
      const proxies = [
        u => u,
        u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
        u => "https://corsproxy.io/?" + encodeURIComponent(u)
      ];
      let lastErr;
      for (const make of proxies){
        try {
          const res = await fetch(make(url), {mode:"cors"});
          if (!res.ok) throw new Error("HTTP "+res.status);
          const html = await res.text();
          if (html && html.length > 200) return html;
        } catch(e){ lastErr = e; }
      }
      throw lastErr || new Error("nelze načíst");
    }
    function parsePlace(html){
      const t = html.replace(/<[^>]+>/g," ").replace(/\s+/g," ");
      const m = t.match(/(\d+)\.\s*TJ Teplice Letná D/);
      return m ? (m[1] + ". místo") : null;
    }
    function parseRound(html, kolo){
      const text = html.replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<[^>]+>/g,"\n").replace(/\u00a0/g," ");
      const out=[];
      const re = /(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})\s+(\d{1,2}:\d{2})\s+([^\n]+?)\s+(?:([\d\s]+)\s+(\d)\s+(\d)\s+([\d\s]+)\s+)?([^\n]+)/g;
      let m;
      while ((m = re.exec(text))){
        const home = normTeam(m[5]).replace(/\.$/,"");
        const away = normTeam(m[10]).replace(/\.$/,"");
        if (!/Teplice Letná D/i.test(home+away)) continue;
        const weHome = /Teplice Letná D/i.test(home);
        const row = {kolo:Number(kolo), datum: Number(m[1])+"."+String(m[2]).padStart(2,"0").replace(/^0/,"")+("."+m[3]).replace("..","."), cas:m[4], souper: weHome?away:home, misto: weHome?"doma":"venku"};
        row.datum = Number(m[1]) + "." + Number(m[2]) + "." + m[3];
        if (m[6]!=null){
          const kh = Number(String(m[6]).replace(/\s/g,""));
          const bh = Number(m[7]), ba = Number(m[8]);
          const ka = Number(String(m[9]).replace(/\s/g,""));
          row.odehrano = "ano";
          row.body_td = weHome?bh:ba;
          row.body_opp = weHome?ba:bh;
          row.vysledek = row.body_td+":"+row.body_opp;
          row.kuzelky_td = weHome?kh:ka;
          row.kuzelky_opp = weHome?ka:kh;
        }
        out.push(row);
      }
      return out;
    }
    async function aktualizovat(){
      const btn = $("#btnUpdate");
      const msg = $("#updateMsg");
      btn.disabled = true;
      msg.textContent = "Načítám vysledky.kuzelky.cz…";
      const base = "https://vysledky.kuzelky.cz/detail-souteze/okresni-prebor-b-2026-2027";
      const patch = {matches:[], place:null};
      let loaded = 0;
      try {
        const first = await fetchHtml(base);
        loaded++;
        patch.place = parsePlace(first);
        for (let k=1;k<=18;k++){
          msg.textContent = "Kontroluji "+k+". kolo…";
          const html = k===1 ? first : await fetchHtml(base+"?round="+k);
          loaded++;
          patch.matches.push(...parseRound(html, k));
        }
        patch.matches.forEach(p => {
          const m = DATA.matches.find(x => x.rocnik==="2026/2027" && Number(x.kolo)===Number(p.kolo));
          if (m) Object.assign(m, Object.fromEntries(Object.entries(p).filter(([,v]) => v!=null && v!=="")));
        });
        if (patch.place) {
          DATA.meta = DATA.meta || {};
          DATA.meta.umisteni = Object.assign({}, DATA.meta.umisteni, {"2026/2027": patch.place});
          Object.assign(PLACEMENT, DATA.meta.umisteni);
        }
        const now = new Date();
        const ts = now.toLocaleString("cs-CZ", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
        localStorage.setItem("tepliceD_lastUpdate", ts);
        localStorage.setItem("tepliceD_resultPatch", JSON.stringify(patch));
        showLastUpdate();
        msg.textContent = "Doplněno kol: "+patch.matches.length+(patch.place?(" · "+patch.place):"");
      } catch (e) {
        msg.textContent = "Web se nepodařilo načíst. Zkuste to na https stránce (ne z disku).";
      }
      render();
      showLastUpdate();
      btn.disabled = false;
    }
    applySavedResults();
    showLastUpdate();
    $("#btnUpdate").onclick = aktualizovat;
  </script>
</body>
</html>
